<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Infographic và Video Nhiệm vụ 2.2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        iframe {
            width: 100%;
            height: 450px;
            margin-bottom: 20px;
        }
        .copyright {
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Infographic và Video minh họa Nhiệm vụ 2.2</h1>
        <p>Đây là infographic minh họa nội dung bài tập, kèm theo video YouTube hỗ trợ cho Nhiệm vụ 2.2.</p>
        
        <!-- Hiển thị infographic -->
        <img src="Lab05_Ex2.1.png" alt="Infographic Lab05_Ex2.1">
        
        <!-- Nhúng video YouTube -->
        <iframe src="https://www.youtube.com/embed/Bm_pVUcdAE0" 
                title="Video Nhiệm vụ 2.2" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
        
        <!-- Ghi chú bản quyền -->
        <p class="copyright">© 2026 Bản quyền thuộc về tác giả infographic và video.</p>
    </div>
</body>
</html>
